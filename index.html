<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Trombone Punch</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
    touch-action:none;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;

    background:
    linear-gradient(
        rgba(0,0,0,0.4),
        rgba(0,0,0,0.7)
    ),
    url("images/background.jpg");

    background-size:cover;
    background-position:center;
}

#score{
    position:absolute;
    top:20px;
    left:20px;
    color:white;
    font-size:50px;
    z-index:100;
}

#timer{
    position:absolute;
    top:20px;
    right:30px;
    color:white;
    font-size:50px;
    z-index:100;
}

#player{
    position:absolute;
    width:140px;
    height:140px;
    object-fit:contain;
    z-index:20;
}

.enemy{
    position:absolute;
    width:80px;
    height:80px;
    font-size:70px;
    z-index:10;
    user-select:none;
}

#punchButton{
    position:absolute;
    right:30px;
    bottom:30px;
    width:120px;
    height:120px;
    border:none;
    border-radius:50%;
    background:red;
    color:white;
    font-size:28px;
    font-weight:bold;
    z-index:100;
    cursor:pointer;

    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    user-select:none;
    -webkit-user-select:none;
    outline:none;
}

#mobilePad{
    position:absolute;
    left:20px;
    bottom:20px;
    z-index:200;
}

#mobilePad button{
    width:80px;
    height:80px;
    margin:5px;
    font-size:40px;
    border:none;
    border-radius:20px;
    background:#444;
    color:white;
    opacity:0.8;

    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    user-select:none;
    -webkit-user-select:none;
    outline:none;
}

@media (min-width:900px){

    #mobilePad{
        display:none;
    }
}

#startScreen,
#messageScreen,
#resultScreen{
    position:absolute;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.9);
    z-index:500;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:white;
}

#messageScreen,
#resultScreen{
    display:none;
}

#startScreen button,
#messageScreen button{
    margin:10px;
    padding:20px 40px;
    font-size:30px;

    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    user-select:none;
    -webkit-user-select:none;
    outline:none;
}

</style>
</head>

<body>

<div id="game">

    <div id="score">
        Score : 0
    </div>

    <div id="timer">
        30
    </div>

    <img
    id="player"
    src="images/hero_idle.png">

    <div id="mobilePad">

        <button id="upBtn" tabindex="-1">
            ↑
        </button>

        <div>

            <button id="leftBtn" tabindex="-1">
                ←
            </button>

            <button id="downBtn" tabindex="-1">
                ↓
            </button>

            <button id="rightBtn" tabindex="-1">
                →
            </button>

        </div>

    </div>

    <button
    id="punchButton"
    tabindex="-1">

        PUNCH

    </button>

    <div id="startScreen">

        <h1>
            Trombone Punch
        </h1>

        <h2>
            人数を選択
        </h2>

        <button id="btn1">
            1 PLAYER
        </button>

        <button id="btn2">
            2 PLAYERS
        </button>

        <button id="btn3">
            3 PLAYERS
        </button>

    </div>

    <div id="messageScreen">

        <h1 id="messageText">
            PLAYER 1 START
        </h1>

        <button id="nextButton">
            START
        </button>

    </div>

    <div id="resultScreen">

        <h1>
            RESULT
        </h1>

        <div id="resultText"></div>

    </div>

</div>

<script>

const game =
document.getElementById("game");

const scoreEl =
document.getElementById("score");

const timerEl =
document.getElementById("timer");

const punchButton =
document.getElementById("punchButton");

const startScreen =
document.getElementById("startScreen");

const messageScreen =
document.getElementById("messageScreen");

const resultScreen =
document.getElementById("resultScreen");

const resultText =
document.getElementById("resultText");

const messageText =
document.getElementById("messageText");

const nextButton =
document.getElementById("nextButton");

const player =
document.getElementById("player");

let playerX = 100;
let playerY = 300;

player.style.left =
playerX + "px";

player.style.top =
playerY + "px";

let score = 0;

let enemies = [];

let punching = false;

let up = false;
let down = false;
let left = false;
let right = false;

let totalPlayers = 1;

let currentPlayer = 1;

let scores = [];

let timeLeft = 30;

let gameRunning = false;

let timerInterval;


//
// 人数選択
//
function selectPlayers(num){

    totalPlayers = num;

    scores =
    new Array(num).fill(0);

    startScreen.style.display =
    "none";

    showPlayerStart();
}


//
// ボタン
//
document.getElementById("btn1")
.addEventListener("click",()=>{

    selectPlayers(1);

});

document.getElementById("btn2")
.addEventListener("click",()=>{

    selectPlayers(2);

});

document.getElementById("btn3")
.addEventListener("click",()=>{

    selectPlayers(3);

});


//
// 開始画面
//
function showPlayerStart(){

    messageScreen.style.display =
    "flex";

    messageText.innerText =
    "PLAYER " +
    currentPlayer +
    " START";
}


//
// START
//
nextButton.addEventListener(
"click",()=>{

    messageScreen.style.display =
    "none";

    startTurn();

});


//
// ターン開始
//
function startTurn(){

    score = 0;

    scoreEl.innerText =
    "Score : 0";

    timeLeft = 30;

    timerEl.innerText =
    timeLeft;

    playerX = 100;
    playerY = 300;

    gameRunning = true;

    enemies.forEach(enemy=>{

        enemy.el.remove();

    });

    enemies = [];

    clearInterval(timerInterval);

    timerInterval =
    setInterval(()=>{

        timeLeft--;

        timerEl.innerText =
        timeLeft;

        if(timeLeft <= 0){

            endTurn();
        }

    },1000);
}


//
// ターン終了
//
function endTurn(){

    clearInterval(timerInterval);

    gameRunning = false;

    scores[currentPlayer - 1] =
    score;

    currentPlayer++;

    if(currentPlayer > totalPlayers){

        showResult();

    }else{

        showPlayerStart();
    }
}


//
// 結果
//
function showResult(){

    resultScreen.style.display =
    "flex";

    let html = "";

    for(let i = 0;
        i < scores.length;
        i++){

        html +=
        "<h2>PLAYER " +
        (i + 1) +
        " : " +
        scores[i] +
        "</h2>";
    }

    resultText.innerHTML =
    html;
}


//
// キーボード
//
document.addEventListener(
"keydown",(e)=>{

    if(e.key === "ArrowUp"){
        up = true;
    }

    if(e.key === "ArrowDown"){
        down = true;
    }

    if(e.key === "ArrowLeft"){
        left = true;
    }

    if(e.key === "ArrowRight"){
        right = true;
    }

    if(e.code === "Space"){

        punch();
    }
});

document.addEventListener(
"keyup",(e)=>{

    if(e.key === "ArrowUp"){
        up = false;
    }

    if(e.key === "ArrowDown"){
        down = false;
    }

    if(e.key === "ArrowLeft"){
        left = false;
    }

    if(e.key === "ArrowRight"){
        right = false;
    }
});


//
// スマホ操作
//
const upBtn =
document.getElementById("upBtn");

const downBtn =
document.getElementById("downBtn");

const leftBtn =
document.getElementById("leftBtn");

const rightBtn =
document.getElementById("rightBtn");

upBtn.addEventListener(
"touchstart",()=>{

    up = true;

});

upBtn.addEventListener(
"touchend",()=>{

    up = false;

});

downBtn.addEventListener(
"touchstart",()=>{

    down = true;

});

downBtn.addEventListener(
"touchend",()=>{

    down = false;

});

leftBtn.addEventListener(
"touchstart",()=>{

    left = true;

});

leftBtn.addEventListener(
"touchend",()=>{

    left = false;

});

rightBtn.addEventListener(
"touchstart",()=>{

    right = true;

});

rightBtn.addEventListener(
"touchend",()=>{

    right = false;

});


//
// パンチボタン
//
punchButton.addEventListener(
"click",()=>{

    punch();

});


//
// プレイヤー更新
//
function updatePlayer(){

    if(up){
        playerY -= 6;
    }

    if(down){
        playerY += 6;
    }

    if(left){
        playerX -= 6;
    }

    if(right){
        playerX += 6;
    }

    if(playerX < 0){
        playerX = 0;
    }

    if(playerY < 0){
        playerY = 0;
    }

    if(playerX >
       window.innerWidth - 140){

        playerX =
        window.innerWidth - 140;
    }

    if(playerY >
       window.innerHeight - 140){

        playerY =
        window.innerHeight - 140;
    }

    player.style.left =
    playerX + "px";

    player.style.top =
    playerY + "px";
}


//
// 敵生成
//
function spawnEnemy(){

    const enemy =
    document.createElement("div");

    enemy.className =
    "enemy";

    const notes = [
        "♪",
        "♫",
        "♬",
        "♩",
        "♭"
    ];

    const note =
    notes[
        Math.floor(
            Math.random() *
            notes.length
        )
    ];

    enemy.innerText =
    note;

    game.appendChild(enemy);

    enemies.push({

        el: enemy,

        note: note,

        x:
        window.innerWidth + 100,

        y:
        Math.random() *
        (window.innerHeight - 120),

        speed:
        3 + Math.random() * 4

    });
}


//
// パンチ
//
function punch(){

    if(!gameRunning) return;

    if(punching) return;

    punching = true;

    player.src =
    "images/hero_punch.png";

    const punchLeft =
    playerX + 90;

    const punchRight =
    playerX + 240;

    const punchTop =
    playerY + 20;

    const punchBottom =
    playerY + 120;

    for(
        let i = enemies.length - 1;
        i >= 0;
        i--
    ){

        const enemy =
        enemies[i];

        const enemyLeft =
        enemy.x;

        const enemyRight =
        enemy.x + 80;

        const enemyTop =
        enemy.y;

        const enemyBottom =
        enemy.y + 80;

        const hit =

        punchLeft <
        enemyRight &&

        punchRight >
        enemyLeft &&

        punchTop <
        enemyBottom &&

        punchBottom >
        enemyTop;

        if(hit){

            if(enemy.note === "♭"){

                score -= 100;

                if(score < 0){
                    score = 0;
                }

            }else{

                score += 100;
            }

            scoreEl.innerText =
            "Score : " + score;

            enemy.el.remove();

            enemies.splice(i,1);
        }
    }

    setTimeout(()=>{

        player.src =
        "images/hero_idle.png";

        punching = false;

    },500);
}


//
// 敵更新
//
function updateEnemies(){

    for(
        let i = enemies.length - 1;
        i >= 0;
        i--
    ){

        const enemy =
        enemies[i];

        enemy.x -= enemy.speed;

        enemy.el.style.left =
        enemy.x + "px";

        enemy.el.style.top =
        enemy.y + "px";

        if(enemy.x < -100){

            enemy.el.remove();

            enemies.splice(i,1);
        }
    }
}


//
// メインループ
//
function gameLoop(){

    updatePlayer();

    updateEnemies();

    requestAnimationFrame(
        gameLoop
    );
}


//
// 敵スポーン
//
setInterval(()=>{

    if(gameRunning){

        spawnEnemy();
    }

},700);


//
// 開始
//
gameLoop();

</script>

</body>
</html>
