<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Trombone Punch</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;

    background:
    linear-gradient(#222,#000);
}

#score{
    position:absolute;

    top:20px;
    left:20px;

    color:white;
    font-size:50px;

    z-index:100;
}

#player{
    position:absolute;

    width:140px;
    height:140px;

    object-fit:contain;

    z-index:20;
}

.enemy{
    position:absolute;

    width:80px;
    height:80px;

    object-fit:contain;
}

#punchButton{
    position:absolute;

    right:30px;
    bottom:30px;

    width:120px;
    height:120px;

    border:none;
    border-radius:50%;

    background:red;
    color:white;

    font-size:28px;
    font-weight:bold;

    z-index:100;

    cursor:pointer;
}

#punchButton:active{
    transform:scale(0.95);
}

</style>
</head>

<body>

<div id="game">

    <div id="score">
        Score : 0
    </div>

    <button id="punchButton">
        PUNCH
    </button>

</div>

<script src="script.js"></script>

</body>
</html>
