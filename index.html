<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Trombone Punch</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#111;
    font-family:Arial;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:
    linear-gradient(#222,#111);
}

#player{
    position:absolute;
    width:180px;
    height:180px;
    left:200px;
    bottom:60px;
    z-index:10;
}

.enemy{
    position:absolute;
    width:140px;
    height:140px;
}

.item{
    position:absolute;
    width:80px;
    height:80px;
}

.punch{
    position:absolute;
    width:170px;
    height:70px;
    z-index:9;
}

#ui{
    position:absolute;
    top:20px;
    left:20px;
    color:white;
    z-index:100;
}

#score{
    font-size:40px;
}

#combo{
    font-size:48px;
    color:gold;
}

</style>

</head>

<body>

<div id="game">

    <div id="ui">
        <div id="score">Score : 0</div>
        <div id="combo"></div>
    </div>

    <img
        id="player"
        src="images/hero_idle.png"
    >

</div>

<script src="script.js"></script>

</body>
</html>
