<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Trombone Punch</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;

    background:
    linear-gradient(#222,#000);
}

#score{
    position:absolute;

    top:20px;
    left:20px;

    color:white;
    font-size:50px;

    z-index:100;
}

#player{
    position:absolute;

    width:140px;
    height:140px;

    object-fit:contain;

    z-index:20;
}

.enemy{
    position:absolute;

    width:80px;
    height:80px;

    background:red;

    border-radius:10px;
}

.slide{
    position:absolute;

    width:180px;
    height:40px;

    background:yellow;

    z-index:50;
}

</style>
</head>

<body>

<div id="game">

    <div id="score">
        Score : 0
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
