<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0s">

<title>Trombone Punch</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#111;
    font-family:Arial, sans-serif;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:
    linear-gradient(#222,#000);
}

#score{
    position:absolute;
    top:20px;
    left:20px;
    color:white;
    font-size:40px;
    z-index:100;
}

#player{
    position:absolute;
    width:120px;
    height:120px;
    object-fit:contain;
    z-index:10;
}

.enemy{
    position:absolute;
    width:70px;
    height:70px;
    object-fit:contain;
}



#punchButton{
    position:absolute;

    right:30px;
    bottom:30px;

    width:120px;
    height:120px;

    border:none;
    border-radius:50%;

    background:red;
    color:white;

    font-size:28px;
    font-weight:bold;

    z-index:100;

    cursor:pointer;
}

#punchButton:active{
    transform:scale(1.5);
}

</style>

</head>

<body>

<div id="game">

    <div id="score">
        Score : 0
    </div>

    <button id="punchButton">
        PUNCH
    </button>

</div>

<script>

const game =
document.getElementById("game");

const scoreEl =
document.getElementById("score");

const punchButton =
document.getElementById("punchButton");


//
// 主人公生成
//
const player =
document.createElement("img");

player.id = "player";

player.src =
"images/hero_idle.png";

let playerX = 150;
let playerY = 300;

player.style.left =
playerX + "px";

player.style.top =
playerY + "px";

game.appendChild(player);


//
// スコア
//
let score = 0;


//
// 入力
//
let up = false;
let down = false;
let left = false;
let right = false;


//
// 敵配列
//
let enemies = [];


//
// パンチ状態
//
let punching = false;


//
// キーボード
//
document.addEventListener(
"keydown",(e)=>{

    if(e.key === "ArrowUp"){
        up = true;
    }

    if(e.key === "ArrowDown"){
        down = true;
    }

    if(e.key === "ArrowLeft"){
        left = true;
    }

    if(e.key === "ArrowRight"){
        right = true;
    }

    if(e.code === "Space"){
        punch();
    }
});

document.addEventListener(
"keyup",(e)=>{

    if(e.key === "ArrowUp"){
        up = false;
    }

    if(e.key === "ArrowDown"){
        down = false;
    }

    if(e.key === "ArrowLeft"){
        left = false;
    }

    if(e.key === "ArrowRight"){
        right = false;
    }
});


//
// パンチボタン
//
punchButton.addEventListener(
"click",()=>{

    punch();

});


//
// プレイヤー更新
//
function updatePlayer(){

    if(up){
        playerY -= 6;
    }

    if(down){
        playerY += 6;
    }

    if(left){
        playerX -= 6;
    }

    if(right){
        playerX += 6;
    }

    // 画面制限
    if(playerX < 0){
        playerX = 0;
    }

    if(playerX >
       window.innerWidth - 120){

        playerX =
        window.innerWidth - 120;
    }

    if(playerY < 0){
        playerY = 0;
    }

    if(playerY >
       window.innerHeight - 120){

        playerY =
        window.innerHeight - 120;
    }

    player.style.left =
    playerX + "px";

    player.style.top =
    playerY + "px";
}


//
// 敵生成
//
function spawnEnemy(){

    const enemy =
    document.createElement("img");

    enemy.src =
    "images/enemy_idle.png";

    enemy.className =
    "enemy";

    // 右端から出現
    enemy.x =
    window.innerWidth;

    // ランダム高さ
    enemy.y =
    Math.random() *
    (window.innerHeight - 120);

    // ランダム速度
    enemy.speed =
    2 + Math.random() * 5;

    // 初期位置
    enemy.style.left =
    enemy.x + "px";

    enemy.style.top =
    enemy.y + "px";

    game.appendChild(enemy);

    enemies.push(enemy);
}


//
// パンチ
//
function punch(){

    if(punching) return;

    punching = true;

    player.src =
    "images/hero_punch.png";

    //
    // 当たり判定
    //
    for(let i =
        enemies.length - 1;
        i >= 0;
        i--){

        const enemy =
        enemies[i];

        const hitX =

        enemy.x <
        playerX + 260 &&

        enemy.x >
        playerX + 100;

        const hitY =

        enemy.y <
        playerY + 100 &&

        enemy.y >
        playerY - 50;

        if(hitX && hitY){

            score += 100;

            scoreEl.innerText =
            "Score : " + score;

            enemy.src =
            "images/enemy_hit.png";

            setTimeout(()=>{

                enemy.remove();

            },100);

            enemies.splice(i,1);
        }
    }

    setTimeout(()=>{

        slide.remove();

        player.src =
        "images/hero.png";

        punching = false;

    },150);
}


//
// 敵更新
//
function updateEnemies(){

    for(let i =
        enemies.length - 1;
        i >= 0;
        i--){

        const enemy =
        enemies[i];

        // 左移動
        enemy.x -= enemy.speed;

        enemy.style.left =
        enemy.x + "px";

        // 画面外
        if(enemy.x < -100){

            enemy.remove();

            enemies.splice(i,1);
        }
    }
}


//
// メインループ
//
function gameLoop(){

    updatePlayer();

    updateEnemies();

    requestAnimationFrame(
    gameLoop);
}


//
// 敵スポーン
//
setInterval(()=>{

    spawnEnemy();

},1200);


//
// 開始
//
gameLoop();

</script>

</body>
</html>
